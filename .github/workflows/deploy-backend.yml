name: Deploy Backend to Cloud Run

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'backend/**'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: recipe-agent-api
          source: ./backend
          region: europe-west1
          secrets: |
            /secrets/rewe-cert/latest=rewe-cert:latest
            /secrets/rewe-key/latest=rewe-key:latest
          env_vars: |
            ALLOWED_ORIGINS=${{ vars.ALLOWED_ORIGINS }}
            REWE_CERT_PATH=/secrets/rewe-cert/latest
            REWE_KEY_PATH=/secrets/rewe-key/latest
